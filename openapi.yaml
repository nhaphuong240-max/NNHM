components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token (TTL 15 minutes). Requires X-Tenant-Id header.
    RefreshToken:
      type: apiKey
      in: header
      name: X-Refresh-Token
      description: Refresh token (also accepted in request body or httpOnly cookie).
    WebhookHmac:
      type: apiKey
      in: header
      name: X-Signature
      description: HMAC-SHA256 signature + gateway IP allowlist.
  parameters:
    XTenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Tenant context for RLS isolation (FR-ID-03).
    XRequestId:
      name: X-Request-Id
      in: header
      required: false
      schema:
        type: string
        format: uuid
      description: Trace correlation ID (NFR-O01).
    XIdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
      description: Idempotency key for safe retries (TTL 24h).
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
      description: Cursor for pagination.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Page size (max 100).
  schemas:
    ApiResponse:
      type: object
      required:
      - data
      properties:
        data:
          oneOf:
          - $ref: '#/components/schemas/Resource'
          - type: array
            items:
              $ref: '#/components/schemas/Resource'
          - type: object
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    Resource:
      type: object
      required:
      - id
      - type
      properties:
        id:
          type: string
          description: Prefixed ULID (un_, ls_, bk_, ld_)
        type:
          type: string
        attributes:
          type: object
          additionalProperties: true
        relationships:
          type: object
          additionalProperties: true
    ResponseMeta:
      type: object
      properties:
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
        page:
          $ref: '#/components/schemas/PageMeta'
    PageMeta:
      type: object
      properties:
        cursor:
          type:
          - string
          - 'null'
        nextCursor:
          type:
          - string
          - 'null'
        hasMore:
          type: boolean
        limit:
          type: integer
        number:
          type: integer
        size:
          type: integer
        totalElements:
          type: integer
        totalPages:
          type: integer
    ProblemDetails:
      type: object
      description: RFC 7807 Problem Details
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
          format: uuid
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
              message:
                type: string
    LoginRequest:
      type: object
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        tenantId:
          type: string
    RefreshTokenRequest:
      type: object
      required:
      - refreshToken
      properties:
        refreshToken:
          type: string
    WebhookAckResponse:
      type: object
      properties:
        received:
          type: boolean
        processed:
          type: boolean
        ledgerEntryId:
          type: string
    GenericObject:
      type: object
      additionalProperties: true
  responses:
    ProblemDetails:
      description: Error response (RFC 7807)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ProblemDetails'
