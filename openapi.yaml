      description: 'UC-ID-03 step-up. Tenant `LIVE_RAILS.mfaSandbox` wins over `MFA_SANDBOX`. Demo OTP `123456` is rejected when sandbox is off. Login `challengeId` issues JWT after a valid TOTP.'
