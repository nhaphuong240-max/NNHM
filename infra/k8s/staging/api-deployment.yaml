apiVersion: apps/v1
kind: Deployment
metadata:
  name: wereal-api
  labels:
    app: wereal-api
    tier: t3
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wereal-api
  template:
    metadata:
      labels:
        app: wereal-api
    spec:
      containers:
        - name: api
          image: ghcr.io/wereal/api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: wereal-api-config
            - secretRef:
                name: wereal-api-secrets
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wereal-api
spec:
  selector:
    app: wereal-api
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wereal-api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  ingressClassName: nginx
  rules:
    - host: staging-api.wereal.vn
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: wereal-api
                port:
                  number: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wereal-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wereal-api
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
