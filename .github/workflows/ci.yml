name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run t02:config-gate
      - name: T02 wrapper exit cases
        working-directory: apps/api
        env:
          T02_CASES_ROOT: ${{ runner.temp }}/t02-wrapper-cases
        run: chmod +x ../../scripts/t02-api-test.sh ../../scripts/t02-wrapper-cases.sh && ../../scripts/t02-wrapper-cases.sh
      - name: T02 api tests
        working-directory: apps/api
        env:
          T02_RESULT_ROOT: ${{ runner.temp }}/t02-api-test
        run: ../../scripts/t02-api-test.sh
      - run: chmod +x ../../scripts/check-migrations.sh ../../scripts/uat-t7-security.sh
      - run: ../../scripts/check-migrations.sh
      - run: ../../scripts/uat-t7-security.sh
        working-directory: apps/api

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  # Baseline 1738339100000 là bằng chứng schema. Job chạy lại trên pull request.
  # Harness vẫn từ chối bootstrap và không xóa cluster.
  t02-isolated-db:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wereal
          POSTGRES_PASSWORD: wereal
          POSTGRES_DB: wereal_t02
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U wereal -d wereal_t02"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wereal:wereal@localhost:55432/wereal_t02
      REDIS_URL: redis://localhost:56379
      DB_SYNCHRONIZE: 'false'
      NODE_ENV: test
      T02_REQUIRE_ISOLATED_DB: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
        working-directory: apps/api
      - run: chmod +x scripts/t02-harness.sh && ./scripts/t02-harness.sh
      - name: Revert migrations until the baseline tables are gone
        working-directory: apps/api
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            echo "REVERT $i"
            set +e
            output=$(npm run migration:revert 2>&1)
            code=$?
            set -e
            printf '%s\n' "$output"
            echo "REVERT_EXIT $i $code"
            if [ "$code" -ne 0 ]; then
              exit "$code"
            fi
            if printf '%s\n' "$output" | grep -q "Nothing to revert"; then
              break
            fi
          done
          node <<'EOF'
          const fs = require('fs');
          const { Client } = require('pg');
          const sql = fs.readFileSync('src/database/migrations/1738339100000-BaselineCoreSchema.ts', 'utf8');
          const names = [...sql.matchAll(/CREATE TABLE "([a-z0-9_]+)"/g)].map((match) => match[1]);
          if (names.length !== 56) {
            console.error(`expected 56 baseline tables, found ${names.length}`);
            process.exit(1);
          }
          (async () => {
            const client = new Client({ connectionString: process.env.DATABASE_URL });
            await client.connect();
            const left = await client.query(
              `SELECT table_name FROM information_schema.tables
               WHERE table_schema = 'public' AND table_type = 'BASE TABLE'
                 AND table_name = ANY($1::text[])
               ORDER BY table_name`,
              [names],
            );
            await client.end();
            if (left.rows.length) {
              console.error(left.rows.map((row) => row.table_name).join(','));
              process.exit(1);
            }
            console.log('BASELINE_TABLES=0');
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          EOF

  observability-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/uat-t7-observability.sh scripts/apply-tier-t7-observability.sh
      - run: ./scripts/uat-t7-observability.sh

  contract-gate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wereal
          POSTGRES_PASSWORD: wereal
          POSTGRES_DB: wereal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wereal -d wereal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wereal:wereal@localhost:5432/wereal
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: wereal-ci-jwt-secret-min-32-chars-long
      WEBHOOK_HMAC_SECRET: wereal-ci-webhook-secret
      NODE_ENV: development
      AUTH_LOGIN_RATE_LIMIT_PER_MIN: '1000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: chmod +x scripts/contract/validate-openapi.sh scripts/contract/smoke-api-responses.sh
      - run: ./scripts/contract/validate-openapi.sh
      - name: Build & start API for response smoke
        working-directory: apps/api
        run: |
          npm ci
          npm run build
          npm run migration:run
          npm run start:prod &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/v1/health/ready && break
            sleep 2
          done
      - run: ./scripts/contract/smoke-api-responses.sh http://localhost:3000/api/v1

  e2e-pr:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wereal
          POSTGRES_PASSWORD: wereal
          POSTGRES_DB: wereal
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wereal -d wereal"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://wereal:wereal@localhost:5432/wereal
      REDIS_URL: redis://localhost:6379
      WEBHOOK_HMAC_SECRET: wereal-ci-webhook-secret
      JWT_SECRET: wereal-ci-jwt-secret-min-32-chars-long
      AUTH_LOGIN_RATE_LIMIT_PER_MIN: '1000'
      NODE_ENV: development
      MFA_SEED_SANDBOX: 'true'
      SEED_MFA_TOTP_SECRET: JBSWY3DPEHPK3PXP
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Install & build API
        working-directory: apps/api
        run: |
          npm ci
          npm run build
          npm run migration:run
      - name: Start API
        working-directory: apps/api
        run: |
          npm run start:prod &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/api/v1/health/ready && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/v1/health/ready
      - name: Map the registered beachhead host to this runner
        run: echo '127.0.0.1 ngoinhahomnay.vn' | sudo tee -a /etc/hosts
      - name: Build web for E2E
        working-directory: apps/web
        env:
          VITE_API_URL: http://ngoinhahomnay.vn:3000/api/v1
        run: |
          npm ci
          npm run build
      - name: Install Playwright
        working-directory: apps/web
        run: npx playwright install chromium --with-deps
      - name: Playwright E2E PR gate (T7-S3)
        working-directory: apps/web
        env:
          E2E_API_URL: http://localhost:3000/api/v1
          E2E_BASE_URL: http://127.0.0.1:4173
          CI: 'true'
          E2E_WEBHOOK_SECRET: wereal-ci-webhook-secret
        run: npm run test:e2e -- e2e/book.spec.ts e2e/search.spec.ts e2e/developer.spec.ts e2e/vnpay-ledger.spec.ts e2e/mfa.spec.ts e2e/ops.spec.ts e2e/s4-inbox.spec.ts e2e/s5-settlement.spec.ts e2e/s6-ops.spec.ts

  enterprise-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x scripts/uat-enterprise-hardening.sh scripts/uat-tier6-smoke.sh scripts/verify-production-flags.sh scripts/apply-tier-b-env.sh scripts/uat-tier-b-rails.sh
      - run: ./scripts/uat-enterprise-hardening.sh
      - run: ./scripts/uat-tier6-smoke.sh
      - run: ./scripts/verify-production-flags.sh --profile staging --strict apps/api/.env.staging.example
