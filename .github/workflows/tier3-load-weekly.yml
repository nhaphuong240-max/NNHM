name: Tier 3 Load (weekly)

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  k6-read:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wereal
          POSTGRES_PASSWORD: wereal
          POSTGRES_DB: wereal
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: Start API
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://wereal:wereal@localhost:5432/wereal
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: ci-test-secret
        run: |
          npm ci
          npm run build
          node dist/main.js &
          sleep 10
      - name: k6 read load
        env:
          BASE_URL: http://localhost:3000/api/v1
          LOAD_VUS: '50'
          P95_TARGET_MS: '500'
        run: k6 run scripts/load/api-read.k6.js
